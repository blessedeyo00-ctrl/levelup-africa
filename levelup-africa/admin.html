<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Level-Up Africa</title>
<link rel="stylesheet" href="style.css">

<style>
/* ADMIN SPECIFIC STYLES */
.admin-container {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 250px;
  background: #111;
  padding: 20px;
}

.sidebar h2 {
  color: gold;
  margin-bottom: 20px;
}

.sidebar ul {
  list-style: none;
}

.sidebar ul li {
  margin-bottom: 15px;
}

.sidebar ul li a {
  color: white;
  text-decoration: none;
}

.sidebar ul li a:hover {
  color: gold;
}

.admin-content {
  flex: 1;
  padding: 40px;
  background: #000;
}

.card {
  background: #111;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.card h3 {
  color: gold;
}
</style>

</head>
<body>

<div class="admin-container">

  <div class="sidebar">
    <h2>Admin Panel</h2>
    <ul>
      <li><a href="#">Dashboard</a></li>
      <li><a href="#">Registrations</a></li>
      <li><a href="#">Partners</a></li>
      <li><a href="#">Blog Posts</a></li>
      <li><a href="#">Gallery</a></li>
      <li><a href="#">Logout</a></li>
    </ul>
  </div>

  <div class="admin-content">
    <h1 style="color:gold;">Welcome Admin</h1>

    <div class="card">
      <h3>Total Registrations</h3>
      <p>0</p>
    </div>

    <div class="card">
      <h3>Total Partner Requests</h3>
      <p>0</p>
    </div>

    <div class="card">
      <h3>Latest Blog Update</h3>
      <p>No posts yet.</p>
    </div>
  </div>

</div>

</body>
</html>
